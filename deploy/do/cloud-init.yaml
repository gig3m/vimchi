#cloud-config
# vimchi public droplet. create-droplet.sh renders this template and replaces
# every placeholder from the environment (see local.env.example).
# Real keys, hostnames, and addresses belong in local.env, which is gitignored.
hostname: vimchi
manage_etc_hosts: true
disable_root: true
ssh_pwauth: false
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, ufw, unattended-upgrades, rsync, sqlite3]

users:
  - name: __SSH_USER__
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - "__HUB_KEY__"

write_files:
  # Optional SSH user CA. Any cert it signs may log in as __SSH_USER__.
  # A comment when VIMCHI_SSH_USER_CA is unset.
  - path: /etc/ssh/user_ca.pub
    permissions: "0644"
    content: |
      __SSH_USER_CA__
  - path: /etc/ssh/revoked_keys
    permissions: "0644"
    content: |
      __SSH_REVOKED_KEYS__
  - path: /etc/ssh/ssh_known_hosts
    permissions: "0644"
    content: |
      __SSH_HOST_CA__
  - path: /etc/ssh/sshd_config.d/05-user-ca.conf
    permissions: "0644"
    content: |
      TrustedUserCAKeys /etc/ssh/user_ca.pub
      RevokedKeys /etc/ssh/revoked_keys
  - path: /etc/ssh/sshd_config.d/05-no-password.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
  - path: /etc/apt/apt.conf.d/52-vimchi-unattended
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "09:00";
  - path: /opt/vimchi/.env
    permissions: "0600"
    owner: root:root
    content: |
      # GitHub OAuth app. Leave empty to run with sign-in off.
      # Callback URL: https://<your-domain>/auth/github/callback
      VIMCHI_GITHUB_CLIENT_ID=
      VIMCHI_GITHUB_CLIENT_SECRET=
      # Container timezone for logs. UTC when unset.
      TZ=UTC

runcmd:
  - [sh, -c, "curl -fsSL https://get.docker.com | sh"]
  - [usermod, -aG, docker, __SSH_USER__]
  # __TAILSCALE__
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  # __UFW_TAILSCALE__
  - [ufw, allow, "80/tcp"]
  - [ufw, allow, "443/tcp"]
  # __UFW_SSH__
  - [ufw, --force, enable]
  - [mkdir, -p, /opt/vimchi/var, /opt/vimchi/caddy]
  - [chown, -R, "1000:1000", /opt/vimchi/var]
  - [chown, __SSH_USER__:__SSH_USER__, /opt/vimchi, /opt/vimchi/.env]
  - [chown, -R, __SSH_USER__:__SSH_USER__, /opt/vimchi/caddy]
  - [systemctl, restart, ssh]
