# vimchi on the public droplet: Caddy terminates TLS and proxies to the app.
# deploy.sh ships the image (docker save | docker load); nothing is built here.
# /opt/vimchi/.env (written by hand, mode 0600) supplies GitHub OAuth and TZ.
name: vimchi

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  vimchi:
    image: vimchi:latest
    container_name: vimchi
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-UTC}
      VIMCHI_BASE_URL: ${VIMCHI_BASE_URL:-https://vimchi.dev}
      VIMCHI_SECURE_COOKIES: "1"
      VIMCHI_TRUST_PROXY: "1"
      GITHUB_CLIENT_ID: ${VIMCHI_GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${VIMCHI_GITHUB_CLIENT_SECRET:-}
    volumes:
      - ./var:/data
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
