# Local run of the production image. Copy .env.example to .env (gitignored).
# Production is deploy/do.
name: vimchi

services:
  vimchi:
    build:
      context: ..
    image: vimchi:latest
    container_name: vimchi
    restart: unless-stopped
    init: true
    ports:
      - "${VIMCHI_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-UTC}
      VIMCHI_BASE_URL: ${VIMCHI_BASE_URL:-http://localhost:8080}
      VIMCHI_SECURE_COOKIES: ${VIMCHI_SECURE_COOKIES:-0}
      VIMCHI_TRUST_PROXY: ${VIMCHI_TRUST_PROXY:-0}
      GITHUB_CLIENT_ID: ${VIMCHI_GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${VIMCHI_GITHUB_CLIENT_SECRET:-}
    volumes:
      - ../var:/data
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
